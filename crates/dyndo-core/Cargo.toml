[package]
name = "dyndo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
language-tags = { version = "0.3.2", features = ["serde"] }
mp4-atom = { version = "0.12.1", features = ["tokio"] }
opendal = { version = "0.58.0", default-features = false }
relative-path = { version = "2.0.1", features = ["serde"] }
rsmpeg = { version = "0.18", default-features = false, features = ["ffmpeg8", "link_system_ffmpeg"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["serde", "v5"] }

[dev-dependencies]
opendal = { version = "0.58.0", default-features = false, features = ["services-memory"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
