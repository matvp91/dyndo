[package]
name = "dyndo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "dyndo"
path = "src/main.rs"

[dependencies]
dyndo-core = { path = "../dyndo-core" }
dyndo-dash = { path = "../dyndo-dash" }
dyndo-hls = { path = "../dyndo-hls" }
dyndo-image = { path = "../dyndo-image" }
language-tags = "0.3.2"
opendal = { version = "0.58", default-features = false, features = ["services-fs"] }
quick-xml = { version = "0.40", features = ["serialize"] }
relative-path = "2.0.1"
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
