[package]
name = "dyndo-hls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
dyndo-core = { path = "../dyndo-core" }
hls_m3u8 = "0.7"
opendal = { version = "0.58", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
opendal = { version = "0.58", default-features = false, features = ["services-memory"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
