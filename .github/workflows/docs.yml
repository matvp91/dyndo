name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job needs Pages + OIDC.
permissions:
  contents: read

# Serialize deploys; never cancel a Pages deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep in sync with the mdbook version used locally.
  MDBOOK_VERSION: 0.5.4

jobs:
  # Build the book on every push and PR so broken docs fail CI early.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build book
        run: mdbook build docs
      - name: Upload book
        uses: actions/upload-artifact@v7
        with:
          name: book
          path: docs/book/.

  # The Pages archive preserves every release under /<version>/ and serves
  # in-progress main documentation from /next/. Pull requests only build it.
  publish:
    name: publish archive
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: book
          path: docs/book
      - name: Determine destination
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=next
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.value != 'next'
      - name: Generate the asset schema in Docker
        if: steps.version.outputs.value != 'next'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: schema-output
          outputs: type=local,dest=docs/book
          cache-from: type=gha,scope=dyndo-linux
          cache-to: type=gha,mode=max,scope=dyndo-linux
      - name: Check out or create the Pages archive
        env:
          ARCHIVE: ${{ runner.temp }}/pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git clone --depth 1 --branch gh-pages "$(git remote get-url origin)" "$ARCHIVE"
          else
            git init "$ARCHIVE"
            git -C "$ARCHIVE" checkout --orphan gh-pages
            git -C "$ARCHIVE" remote add origin "$(git remote get-url origin)"
          fi
      - name: Update the Pages archive
        env:
          ARCHIVE: ${{ runner.temp }}/pages
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [[ "$VERSION" != next ]]; then
            if [[ -e "$ARCHIVE/$VERSION/schema.json" ]]; then
              diff --brief -r docs/book "$ARCHIVE/$VERSION"
            else
              mkdir -p "$ARCHIVE/$VERSION"
              rsync -a --delete docs/book/ "$ARCHIVE/$VERSION/"
            fi
            cp scripts/install.sh "$ARCHIVE/install.sh"
            printf '<!doctype html><meta http-equiv="refresh" content="0; url=./%s/">\n' "$VERSION" > "$ARCHIVE/index.html"
          else
            mkdir -p "$ARCHIVE/$VERSION"
            rsync -a --delete docs/book/ "$ARCHIVE/$VERSION/"
            if [[ ! -e "$ARCHIVE/index.html" ]]; then
              cp scripts/install.sh "$ARCHIVE/install.sh"
              printf '<!doctype html><meta http-equiv="refresh" content="0; url=./next/">\n' > "$ARCHIVE/index.html"
            fi
          fi
          touch "$ARCHIVE/.nojekyll"
      - name: Commit the Pages archive
        env:
          ARCHIVE: ${{ runner.temp }}/pages
        run: |
          git -C "$ARCHIVE" config user.name github-actions[bot]
          git -C "$ARCHIVE" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$ARCHIVE" add --all
          git -C "$ARCHIVE" diff --cached --quiet || git -C "$ARCHIVE" commit -m "docs: publish ${{ steps.version.outputs.value }}"
          git -C "$ARCHIVE" push origin gh-pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  # Deploy the complete archive, not just the current build, so tag deploys
  # never replace previously published release documentation.
  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
