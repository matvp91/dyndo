name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustfmt.toml uses `group_imports`, a nightly-only option. Pinned to a
      # dated nightly so formatting is reproducible (keep in sync with the
      # Makefile `NIGHTLY` variable).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: rustfmt
      - run: make fmt-check

  verify:
    name: verify (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Run Linux verification in Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: verify
          cache-from: type=gha,scope=dyndo-linux
          cache-to: type=gha,mode=max,scope=dyndo-linux

  fixture-budget:
    name: fixture budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject oversized MP4 fixtures
        run: |
          oversized=$(find crates/dyndo-core/tests/fixtures -type f -name '*.mp4' -size +4k -print -quit)
          test -z "$oversized" || {
            echo "MP4 test fixtures must be at most 4 KiB: $oversized"
            exit 1
          }

  build:
    name: build (Linux runtime image)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          cache-from: type=gha,scope=dyndo-linux
          cache-to: type=gha,mode=max,scope=dyndo-linux
